# Builds the Windows installer and the Mac dmg whenever a version tag
# (v0.2.0, v0.3.0, …) is pushed, and attaches both to one GitHub Release.
#
# To ship a release:
#   git tag v0.x.y && git push origin v0.x.y
# (keep package.json "version" in step with the tag)
#
# Stable download links (always the newest release):
#   https://github.com/elliotnah05/accellearn_invoice/releases/latest/download/AccelLearn-Invoices-Setup.exe
#   https://github.com/elliotnah05/accellearn_invoice/releases/latest/download/AccelLearn-Invoices.dmg

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Sequential, not parallel: both jobs publish to the same release, and
      # softprops/action-gh-release creating it twice at once can race.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            artifact: dist/AccelLearn-Invoices-Setup.exe
          - os: macos-latest
            artifact: dist/AccelLearn-Invoices.dmg
    env:
      # No code-signing certificates configured — build unsigned on both OSes.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --publish never

      # Uploads straight to the GitHub Release (not Actions artifact storage,
      # which is a separate, much smaller quota that release installers — tens
      # to hundreds of MB each, every tag — chew through fast). Each OS job
      # calls this independently; action-gh-release appends to the same
      # release rather than replacing it, so both files land on one release.
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          fail_on_unmatched_files: true
